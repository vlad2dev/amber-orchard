[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
ahash = "=0.8.12"
arrow-array = "=55.2.0"
arrow-schema = "=55.2.0"
memchr = "=2.7.5"
memmap2 = "=0.9.5"
mimalloc = "=0.1.48"
parquet = { version = "=55.2.0", default-features = false, features = ["arrow"] }
rayon = "=1.10.0"
serde_json = "=1.0.140"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
